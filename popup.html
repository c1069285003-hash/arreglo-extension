<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arreglo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 340px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8fafc;
    color: #1e293b;
  }
  .header {
    background: #1e3a5f;
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #93c5fd; margin-top: 2px; }
  .body { padding: 14px; }
  .section { margin-bottom: 14px; }
  label { font-size: 11px; font-weight: 600; color: #64748b; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  input {
    width: 100%; padding: 8px 10px;
    border: 1px solid #e2e8f0; border-radius: 7px;
    font-size: 13px; background: white; color: #1e293b;
    outline: none;
  }
  input:focus { border-color: #1e3a5f; }
  .btn {
    width: 100%; padding: 10px;
    border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    margin-bottom: 8px;
  }
  .btn-primary { background: #1e3a5f; color: white; }
  .btn-primary:hover { background: #1e40af; }
  .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-secondary { background: #e2e8f0; color: #475569; }
  .btn-secondary:hover { background: #cbd5e1; }
  .status-box {
    padding: 10px 12px; border-radius: 8px;
    font-size: 12px; line-height: 1.5; margin-bottom: 10px;
  }
  .status-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
  .status-ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  .status-warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  .status-err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .page-tag {
    display: inline-block; padding: 3px 8px;
    background: #dbeafe; color: #1e40af;
    border-radius: 5px; font-size: 11px; font-weight: 600;
    margin-bottom: 10px;
  }
  .client-card {
    background: white; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px;
    font-size: 13px;
  }
  .client-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .client-meta { color: #64748b; font-size: 11px; }
  .results { margin-top: 10px; }
  .result-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; padding: 3px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-ok { background: #22c55e; }
  .dot-fail { background: #ef4444; }
  .dot-skip { background: #f59e0b; }
  .dot-skip { background: #d1d5db; }
  .result-name { color: #64748b; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-val { color: #1e293b; font-weight: 500; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">Arreglo 移达通自动填表</div>
    <div class="header-sub">I-589 · USCIS Autofill</div>
  </div>
</div>
<div class="body">

  <!-- Step 1: Case number input -->
  <div class="section" id="step-login">
    <label>Case Number 案件号</label>
    <input type="text" id="case-number" placeholder="e.g. 26002" maxlength="10" />
    <br><br>
    <button class="btn btn-primary" id="btn-load">Load Client 加载客户</button>
    <div id="load-status"></div>
  </div>

  <!-- Step 2: Client loaded, fill page -->
  <div class="section" id="step-fill" style="display:none">
    <div id="client-card"></div>
    <div id="addr-selector"></div>
    <div id="page-tag"></div>
    <div id="fill-status"></div>
    <button class="btn btn-primary" id="btn-fill">Fill This Page 填写此页</button>
    <button class="btn btn-secondary" id="btn-clear">Change Client</button>
    <div class="results" id="fill-results"></div>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
