<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arreglo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 340px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8fafc;
    color: #1e293b;
  }
  .header {
    background: #1e3a5f;
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #93c5fd; margin-top: 2px; }
  .body { padding: 14px; }
  .section { margin-bottom: 14px; }
  label { font-size: 11px; font-weight: 600; color: #64748b; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  input {
    width: 100%; padding: 8px 10px;
    border: 1px solid #e2e8f0; border-radius: 7px;
    font-size: 13px; background: white; color: #1e293b;
    outline: none;
  }
  input:focus { border-color: #1e3a5f; }
  .btn {
    width: 100%; padding: 10px;
    border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    margin-bottom: 8px;
  }
  .btn-primary { background: #1e3a5f; color: white; }
  .btn-primary:hover { background: #1e40af; }
  .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-secondary { background: #e2e8f0; color: #475569; }
  .btn-secondary:hover { background: #cbd5e1; }
  .status-box {
    padding: 10px 12px; border-radius: 8px;
    font-size: 12px; line-height: 1.5; margin-bottom: 10px;
  }
  .status-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
  .status-ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  .status-warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  .status-err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .page-tag {
    display: inline-block; padding: 3px 8px;
    background: #dbeafe; color: #1e40af;
    border-radius: 5px; font-size: 11px; font-weight: 600;
    margin-bottom: 10px;
  }
  .client-card {
    background: white; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px;
    font-size: 13px;
  }
  .client-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .client-meta { color: #64748b; font-size: 11px; }
  .results { margin-top: 10px; }
  .result-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; padding: 3px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-ok { background: #22c55e; }
  .dot-fail { background: #ef4444; }
  .dot-skip { background: #f59e0b; }
  .dot-skip { background: #d1d5db; }
  .result-name { color: #64748b; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-val { color: #1e293b; font-weight: 500; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eoir-card {
    display: none;
    background: white;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .eoir-card.is-visible { display: block; }
  .eoir-title { color: #1e3a5f; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .eoir-state { color: #64748b; font-size: 11px; line-height: 1.45; margin-bottom: 8px; }
  .eoir-preview {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    gap: 4px 8px;
    border-top: 1px solid #e2e8f0;
    padding-top: 8px;
    margin: 8px 0;
    font-size: 11px;
  }
  .eoir-preview dt { color: #64748b; }
  .eoir-preview dd { color: #1e293b; font-weight: 600; overflow-wrap: anywhere; }
  .eoir-preview .eoir-hearing-row { background: #eff6ff; color: #1d4ed8; padding: 5px 6px; }
  .eoir-preview dt.eoir-hearing-row { border-radius: 6px 0 0 6px; font-weight: 700; }
  .eoir-preview dd.eoir-hearing-row { border-radius: 0 6px 6px 0; }
  .eoir-preview .eoir-judge-row { background: #f3e8ff; color: #6b21a8; padding: 5px 6px; }
  .eoir-preview dt.eoir-judge-row { border-radius: 6px 0 0 6px; font-weight: 700; }
  .eoir-preview dd.eoir-judge-row { border-radius: 0 6px 6px 0; }
  .eoir-preview .eoir-address-row { background: #ecfdf5; color: #047857; padding: 5px 6px; }
  .eoir-preview dt.eoir-address-row { border-radius: 6px 0 0 6px; font-weight: 700; }
  .eoir-preview dd.eoir-address-row {
    border-radius: 0 6px 6px 0;
    white-space: nowrap;
    overflow-x: auto;
    overflow-wrap: normal;
  }
  .eoir-actions { display: flex; gap: 6px; }
  .eoir-actions .btn { margin-bottom: 0; }
  .eoir-unlinked-choice {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #e2e8f0;
  }
  .eoir-unlinked-question {
    color: #1e293b;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">Arreglo 移达通自动填表</div>
    <div class="header-sub">I-589 · USCIS Autofill</div>
  </div>
</div>
<div class="body">

  <!-- Explicit, staff-reviewed EOIR ACIS capture -->
  <div class="eoir-card" id="eoir-card" data-state="idle">
    <div class="eoir-title">⚖️ EOIR Case Status 捕获</div>
    <div class="eoir-state" id="eoir-state" aria-live="polite"></div>
    <dl class="eoir-preview" id="eoir-preview" style="display:none"></dl>
    <div class="eoir-actions">
      <button class="btn btn-secondary" id="btn-eoir-capture">Capture EOIR</button>
      <button class="btn btn-primary" id="btn-eoir-confirm" style="display:none">
        Confirm Save to Case Status
      </button>
    </div>
    <div class="eoir-unlinked-choice" id="eoir-unlinked-choice" style="display:none">
      <div class="eoir-unlinked-question" id="eoir-unlinked-question">
        No existing client profile was found. Create one?
      </div>
      <button class="btn btn-secondary" id="btn-eoir-keep-unlinked">
        No — Keep Case Status Only
      </button>
      <button class="btn btn-primary" id="btn-eoir-create-client">
        Yes — Create XY Client
      </button>
    </div>
  </div>

  <!-- Step 1: Case number input -->
  <div class="section" id="step-login">
    <label>Case Number 案件号</label>
    <input type="text" id="case-number" placeholder="e.g. 26002" maxlength="10" />
    <br><br>
    <button class="btn btn-primary" id="btn-load">Load Client 加载客户</button>
    <div id="load-status"></div>
  </div>

  <!-- Step 2: Client loaded, fill page -->
  <div id="cbp-card"></div>
  <div class="section" id="step-fill" style="display:none">
    <div id="client-card"></div>
    <div id="addr-selector"></div>
    <div id="school-selector"></div>
    <div id="page-tag"></div>
    <div id="fill-status"></div>
    <button class="btn btn-primary" id="btn-start-full">Start Filling 从头填写</button>
    <button class="btn btn-primary" id="btn-fill">Fill This Page 填写此页</button>
    <button class="btn btn-secondary" id="btn-clear">Change Client</button>
    <div class="results" id="fill-results"></div>
  </div>

</div>
<script src="eoirPendingState.js"></script>
<script src="popup.js"></script>
</body>
</html>
